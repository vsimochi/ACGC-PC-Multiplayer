# =====================================================================================================================================================
#  Animal Crossing PC Multiplayer - dedicated server settings
# =====================================================================================================================================================
#  HOW TO USE
#   1. Edit the values below with Notepad (only the part AFTER the = sign).  2. Save the file.  3. Double-click "Start Server.bat".
#   Changes take effect the NEXT time the server is started: to apply a change, type  stop  in the server window, wait for it to close, and start it again.
#   Lines that start with # are notes. Put notes on their OWN line, never after a value. A setting you delete from this file uses its default.
#   Before anything starts, "Start Server.bat" checks every value below; if one is wrong it tells you which and does not start the server.
#
#  The server needs the same game folder as the normal game: this file and "Start Server.bat" go next to ACLauncher.exe.
#  Everyone who connects must run the SAME game release as the server.
# =====================================================================================================================================================


# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  port
#   What it controls : the UDP port the server listens on. Players type your address and this number to join.
#   Default / values : 7777.   A whole number from 1 to 65535.
#   For you          : this exact UDP port must be allowed through Windows Firewall, and (for players outside your home) forwarded in your router.
#                      See SERVER_SETUP.txt. Use a different number only if 7777 is already taken by another program or you run two servers
#                      (two servers need two game folders AND two different ports).
#   For players      : they connect to  YOUR-ADDRESS:port  (for example 203.0.113.5:7777).
# -----------------------------------------------------------------------------------------------------------------------------------------------------
port = 7777

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  max_peers
#   What it controls : the most connections the server accepts at the same time (residents + guests + people who are still connecting).
#   Default / values : 8.   A whole number from 1 to 254.
#   For you          : every connection costs a little CPU and network bandwidth, and about 130 KB of memory once it has connected. Raise it only if
#                      your computer and internet upload can keep up.
#   For players      : one more than this is refused with a "connection lost" message until somebody leaves.
#   Limits           : the town itself has 4 resident slots; extra connections are guests (see max_guests).
# -----------------------------------------------------------------------------------------------------------------------------------------------------
max_peers = 8

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  max_guests
#   What it controls : the most GUESTS connected at once. A guest is a visitor with their own character who is not one of the town's residents.
#   Default / values : 4.   A whole number from 1 to 254.   It can NOT be larger than max_peers (every guest needs one connection); the starter refuses that.
#   For you          : more guests = more load on your computer and bandwidth.
#   For players      : a new guest beyond this number is told the server is full. Residents are never refused because of this limit.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
max_guests = 4

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  allow_new_guests
#   What it controls : whether guests the server has never seen before may join.
#   Default / values : 1.   1 = yes, anyone who can reach the server may join as a guest.   0 = no, only guests the server already knows may return.
#   For you          : set 0 to close the server to newcomers once your friends have all visited at least once (a "closed beta" style lock).
#   For players      : with 0, a brand-new player is turned away; a returning guest is unaffected.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
allow_new_guests = 1

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  resident_tokens
#   What it controls : whether a RESIDENT (one of the town's own characters) must prove who they are with a private credential, so nobody else can claim
#                      their character.
#   Default / values : off.   off | tofu | required
#       off      - no credential. Anyone who knows a resident's name could claim that character. Fine for a private server among friends.
#       tofu     - "trust on first use": the first time a resident connects the server hands their game a credential and remembers it; every later
#                  connection must present it. Good protection with no work for you. Limit: whoever connects FIRST for a character gets it.
#       required - a resident WITHOUT a credential is refused until YOU authorize them from the server window with the existing resident commands
#                  (type  help  there; the commands are described in docs\console-commands.md). Most control, most work.
#   For you          : tofu is the easy choice; required means you must approve every resident by hand.
#   For players      : with tofu/required, a resident who plays from a new computer or a fresh install loses the credential and has to be
#                      re-authorized by you.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
resident_tokens = off

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  town_serve
#   What it controls : whether players can DOWNLOAD the server's town when they join, so they see the same town on their screen.
#   Default / values : auto.   auto | off | on
#       auto - the dedicated-server default: the town is served (as "on").
#       on   - serve a SANITIZED copy: other residents' pockets, mail, diary, designs and villager letters are blanked. Names, houses and furniture
#              are NOT blanked.
#       off  - nobody can download the town.
#   For you          : leave it on auto. There is deliberately NO option that serves the unsanitized town: that would hand every resident's private
#                      data to everybody who connects.
#   For players      : with off, a player cannot fetch the town and may see a different town than the server's.
#   Note             : town_serve = off together with personal_sync = on is allowed; personal_sync = off together with town serving is refused (see below).
# -----------------------------------------------------------------------------------------------------------------------------------------------------
town_serve = auto

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  personal_sync
#   What it controls : whether each resident's private diary data is synchronized between the server and that resident's own game (the sanitized town
#                      download blanks it, this puts it back for its owner only, after the player is authenticated).
#   Default / values : auto.   auto | on | off
#       auto - on while the town is served (town_serve is not off), off otherwise.
#       on   - always on.
#       off  - never. Not allowed while the town is served: players would get blank diaries with no way to get them back. The starter refuses it.
#   For you          : leave it on auto.
#   For players      : with it working, their diary and mail come back intact after the town download; with off they stay blank.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
personal_sync = auto

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  interest_management
#   What it controls : how often the server relays other players' MOVEMENT to a player who is far away or in a different place (inside a house, another
#                      area). Nearby players are always updated at full speed, and nobody is ever cut off completely.
#   Default / values : 1.   1 = on (recommended): far-away players are updated less often.   0 = off: everybody gets full-rate updates from everybody.
#   For you          : on saves network bandwidth and CPU, noticeably with many players. Turn it off only to test whether it is causing a problem.
#   For players      : on, a player far away may look slightly less smooth; nearby players look the same either way.
#   Note             : stored in the game's settings.ini ([Network] section); "Start Server.bat" writes it there for you and changes nothing else in that file.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
interest_management = 1

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  guest_memory_mb
#   What it controls : the memory budget, in megabytes, for remembering guests (every guest who has visited keeps an entry: their key, character
#                      record and saved data). It also caps the table of Nook Work Mode jobs, which may use a quarter of it.
#   Default / values : 256.   A whole number from 1 to 1048576.
#   For you          : about 28 KB per remembered guest, so 256 holds roughly nine thousand guests - far more than a friends' server needs. It is a
#                      LIMIT, not memory reserved at start: a larger number can use that much of your computer's RAM only if that many guests really
#                      come. When the budget is full the server replaces the oldest idle guest that never confirmed, and refuses a new guest only if
#                      there is none. Do not set it near your computer's total memory; raise it only if the server log says the budget is used up.
#   For players      : once the budget is exhausted a brand-new guest may be told the server is full.
#   Note             : stored in settings.ini ([Network] section), written by "Start Server.bat".
# -----------------------------------------------------------------------------------------------------------------------------------------------------
guest_memory_mb = 256

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  debug_categories
#   What it controls : which extra technical messages the server prints in its window (the game's own -debug logging).
#   Default / values : empty (nothing extra).   Names separated by commas, NO spaces, for example   network,guests   or   all   (everything).
#       Names: general, network, players, villagers, buildings, items, wildlife, save, events, transactions, records, guests, townsvc, mail, shop
#       (shorter aliases such as net, npc, txn, fish also work).
#   For you          : only for finding problems or when someone asks you for a log. "all" prints a lot and slows the console down.
#   For players      : no effect.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
debug_categories =

# -----------------------------------------------------------------------------------------------------------------------------------------------------
#  check_updates
#   What it controls : whether ACLauncher.exe looks for a new game release before it starts the server.
#   Default / values : 0.   0 = do not check, start immediately (right for a server that restarts unattended).
#                      1 = let ACLauncher.exe check, as it does when you start it yourself (its own updater.ini can still switch checking off).
#   For you          : with 1 the launcher can open a window and WAIT for you to answer, so the server will not start on its own. Update the server
#                      by hand when a new release comes out (see UPDATING.txt) - players need the same release as the server.
#   For players      : no direct effect, but they need the same release as the server; an updated server rejects older clients.
#   Note             : this only affects the server start; your own updater.ini is not changed.
# -----------------------------------------------------------------------------------------------------------------------------------------------------
check_updates = 0
